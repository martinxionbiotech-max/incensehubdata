site_name: IncenseHub Data
site_url: https://data.incensehub.org
site_description: Machine-readable datasets for Chinese botanical incense — ingredients, terminology, aroma, materials, forms, techniques, comparisons and relationships.
hooks:
  - hooks.py

repo_url: https://github.com/martinxionbiotech-max/incensehubdata
theme:
  name: readthedocs
nav:
  - Home: index.md
  - Datasets Overview: datasets.md
  - Ingredient Database: ingredients.md
  - Entity Index: entities/index.md
  - Terminology Database: terminology.md
  - Aroma Database: aroma.md
  - Material Database: materials.md
  - Comparison Database: comparisons.md
  - Technique Database: techniques.md
  - Form Database: forms.md
  - Relationships Database: relationships.md
  - Format & Governance: format.md
  - IncenseHub Main Site: https://incensehub.org
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
